services:
  - type: web
    name: sawti-qalami-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHISPER_MODEL
        value: base
      - key: ENVIRONMENT
        value: production
      # يُولَّد مرة واحدة عند أول نشر ويبقى ثابتًا بعدها
      - key: JWT_SECRET
        generateValue: true
      # تُضبَط يدويًا من لوحة Render (لا أسرار داخل الريبو)
      - key: ALLOWED_ORIGINS   # مثال: https://domain.com,https://www.domain.com
        sync: false
      - key: TEACHER_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
